<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320" role="img" aria-label="Estrella de Belén">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8dc" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#ffd98a" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffb84d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <circle class="estrella-halo" cx="100" cy="100" r="100" fill="url(#halo)"/>
  <!-- cola de luz hacia el establo -->
  <path d="M98.6 108 L101.4 108 L100.6 320 L99.4 320 Z" fill="url(#cola)" filter="url(#blur)"/>
  <g class="estrella-rayos" filter="url(#blur)" fill="#fff6d6">
    <path d="M100 18 C103 70 108 92 182 100 C108 108 103 130 100 182 C97 130 92 108 18 100 C92 92 97 70 100 18 Z"/>
  </g>
  <g fill="#fff" opacity=".9">
    <path d="M100 58 C102 86 106 96 142 100 C106 104 102 114 100 142 C98 114 94 104 58 100 C94 96 98 86 100 58 Z" transform="rotate(45 100 100)" opacity=".45"/>
    <circle cx="100" cy="100" r="7"/>
  </g>
</svg>
